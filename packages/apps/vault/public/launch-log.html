<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFFFFF">
<title>Launch log</title>
<!--
  Source of truth: packages/shared/config/pwa/launch-log.html (copied to each
  app's public/ by `pnpm pwa:sync`). A plain page on purpose: it must open even
  when the app itself is what fails to start. It only reads this device's own
  log (localStorage `ft_launchlog` + the service worker's `ft-log` cache) and
  sends nothing anywhere; the person copies or shares it themselves.
-->
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #0f172a; background: #f8fafc; }
  header { position: sticky; top: 0; background: #fff; padding: calc(12px + env(safe-area-inset-top)) 16px 12px; box-shadow: 0 1px 0 #e2e8f0, 0 4px 14px -6px rgba(15,23,42,.15); }
  h1 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; margin: 0 0 4px; }
  p { margin: 0; color: #475569; font-size: 13px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  button, a.btn { min-height: 40px; padding: 8px 14px; border-radius: 10px; border: 1px solid #cbd5e1; background: #fff; color: #0f172a; font: inherit; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; cursor: pointer; }
  button.primary { background: #0f172a; color: #fff; border-color: #0f172a; }
  #status { min-height: 18px; margin-top: 8px; color: #0d9488; font-weight: 600; font-size: 13px; }
  pre { margin: 12px 16px calc(24px + env(safe-area-inset-bottom)); padding: 12px; background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; white-space: pre-wrap; word-break: break-word; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
</style>
</head>
<body>
<header>
  <h1>Launch log</h1>
  <p>When the app hangs on the splash screen: close it fully, open it again, then copy this and send it. Steps and timings only, kept on this phone.</p>
  <div class="bar">
    <button class="primary" id="copy" type="button">Copy</button>
    <button id="share" type="button" hidden>Share</button>
    <a class="btn" href="/">Back to app</a>
    <button id="clear" type="button">Clear</button>
  </div>
  <div id="status" role="status"></div>
</header>
<pre id="out">Reading…</pre>
<script>
(function () {
  var KEY = 'ft_launchlog', LOG_CACHE = 'ft-log', LOG_KEY = '/__ft-sw-log';
  var out = document.getElementById('out'), status = document.getElementById('status');
  var text = '';

  function pad(n, w) { n = String(n); while (n.length < (w || 2)) n = '0' + n; return n; }
  function clock(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); }
  function stamp(d) { return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) + ' ' + clock(d); }
  function ms(n) { var s = String(n) + 'ms'; while (s.length < 8) s = ' ' + s; return s; }
  function say(msg) { status.textContent = msg; setTimeout(function () { if (status.textContent === msg) status.textContent = ''; }, 2500); }

  function readLaunches() {
    try { var a = JSON.parse(localStorage.getItem(KEY) || '[]'); return a instanceof Array ? a : []; } catch (e) { return []; }
  }
  function readWorkerLog() {
    if (!('caches' in window)) return Promise.resolve(null);
    return caches.open(LOG_CACHE).then(function (c) { return c.match(LOG_KEY); })
      .then(function (r) { return r ? r.json() : []; }).catch(function () { return null; });
  }
  function readWorker() {
    if (!navigator.serviceWorker) return Promise.resolve('not supported');
    return navigator.serviceWorker.getRegistration().then(function (reg) {
      if (!reg) return 'none registered';
      var s = [];
      if (reg.active) s.push('active');
      if (reg.waiting) s.push('one waiting');
      if (reg.installing) s.push('one installing');
      s.push(navigator.serviceWorker.controller ? 'controls this page' : 'not controlling this page');
      return s.join(', ');
    }).catch(function (e) { return 'error: ' + (e && e.message); });
  }
  function readCaches() {
    if (!('caches' in window)) return Promise.resolve('n/a');
    return caches.keys().then(function (k) { return k.join(', ') || 'none'; }).catch(function () { return '?'; });
  }
  /* Low device storage makes Chrome evict a site's data and makes writes fail
     or stall; show what Chrome reports and try a real write. */
  function readStorage() {
    var parts = [];
    var t0 = Date.now(), ok = 'ok';
    try { localStorage.setItem('ft_write_test', String(t0)); localStorage.removeItem('ft_write_test'); }
    catch (e) { ok = 'FAILED (' + ((e && e.name) || e) + ')'; }
    parts.push('local write ' + ok + ' in ' + (Date.now() - t0) + 'ms');
    var est = navigator.storage && navigator.storage.estimate ? navigator.storage.estimate() : Promise.resolve(null);
    var per = navigator.storage && navigator.storage.persisted ? navigator.storage.persisted() : Promise.resolve(null);
    return Promise.all([est.catch(function () { return null; }), per.catch(function () { return null; })]).then(function (r) {
      var mb = function (b) { return (b / 1048576).toFixed(1) + ' MB'; };
      if (r[0] && r[0].quota != null) parts.push('site allowed ' + mb(r[0].quota) + ', using ' + mb(r[0].usage || 0));
      if (r[1] !== null) parts.push(r[1] ? 'kept by Chrome (persistent)' : 'can be evicted when space is low');
      return parts.join(' | ');
    });
  }
  function readBuild() {
    return fetch('/version.json', { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; })
      .then(function (v) { return (v && v.build) || 'unknown'; }).catch(function () { return 'no answer'; });
  }

  function render() {
    out.textContent = 'Reading…';
    Promise.all([readWorkerLog(), readWorker(), readCaches(), readBuild(), readStorage()]).then(function (r) {
      var swLines = r[0], launches = readLaunches().slice().reverse();
      var lines = [];
      lines.push('Launch log · ' + location.host + ' · copied ' + stamp(new Date()));
      lines.push('Server build: ' + r[3] + ' | worker: ' + r[1]);
      lines.push('Caches: ' + r[2]);
      lines.push('Storage: ' + r[4]);
      lines.push('Device: ' + navigator.userAgent);
      lines.push('');
      if (!launches.length) lines.push('(no launches recorded yet: open the app once, then come back here)');
      launches.forEach(function (l) {
        var at = new Date(l.at);
        lines.push('== Launch ' + (isNaN(at) ? l.at : stamp(at)) + ' · ' + l.app + ' · ' + (l.done ? 'reached the screen' : 'DID NOT REACH THE SCREEN') + ' ==');
        (l.steps || []).forEach(function (s) { lines.push(ms(s[0]) + '  ' + s[1]); });
        lines.push('');
      });
      lines.push('== Service worker (newest last) ==');
      if (swLines === null) lines.push('(unavailable)');
      else if (!swLines.length) lines.push('(empty)');
      else swLines.slice(-120).forEach(function (s) {
        var d = new Date(s[0]);
        lines.push(clock(d) + '.' + pad(d.getMilliseconds(), 3) + '  ' + s[1]);
      });
      text = lines.join('\n');
      out.textContent = text;
    });
  }

  document.getElementById('copy').onclick = function () {
    var done = function () { say('Copied'); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else fallback();
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { say('Select the text and copy it'); }
      document.body.removeChild(ta);
    }
  };
  var share = document.getElementById('share');
  if (navigator.share) {
    share.hidden = false;
    share.onclick = function () { navigator.share({ title: 'Launch log', text: text }).catch(function () {}); };
  }
  document.getElementById('clear').onclick = function () {
    if (!confirm('Clear the launch log on this phone?')) return;
    try { localStorage.removeItem(KEY); } catch (e) {}
    var p = 'caches' in window ? caches.open(LOG_CACHE).then(function (c) { return c.delete(LOG_KEY); }).catch(function () {}) : Promise.resolve();
    p.then(function () { say('Cleared'); render(); });
  };
  render();
})();
</script>
</body>
</html>
